[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slider-captcha-solver"
version = "0.1.0"
description = "Solve jigsaw slider captchas in browser automation: white-border gap detection + human-like drag trajectory"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["captcha", "slider", "playwright", "automation", "opencv", "bot-detection"]
authors = [{ name = "vane" }]
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
playwright = ["playwright>=1.40"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Mongovane/slider-captcha-solver"
Issues = "https://github.com/Mongovane/slider-captcha-solver/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/slider_captcha_solver"]
